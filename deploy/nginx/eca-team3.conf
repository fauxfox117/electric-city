# Static SPA site config for the Electric City Aquarium app.
# Copy to /etc/nginx/sites-available/eca-team3.conf on the VM, then:
#   sudo ln -s /etc/nginx/sites-available/eca-team3.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Served on 3001 to match the VM's firewall rule (no TLS here — add a rule for
# 80/443 and switch back to `listen 80` + certbot if you want HTTPS later).

server {
    listen 3001;
    listen [::]:3001;
    server_name your.subdomain.example.com;

    root /var/www/eca-team3/client;
    index index.html;

    # Hashed filenames (assets/*.js, *.css, fonts, images) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing: always fall back to index.html so React Router owns the route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
